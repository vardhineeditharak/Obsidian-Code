name: Build Desktop (Windows & macOS)

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version increment action'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - none (retry current version)

permissions:
  contents: write

jobs:
  bump-version:
    name: Resolve Version & Tag
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      tag_name: ${{ steps.bump.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Process Version Action
        id: bump
        run: |
          BUMP_TYPE="${{ github.event.inputs.bump_type || 'patch' }}"
          echo "Selected version action: $BUMP_TYPE"

          if [[ "$BUMP_TYPE" =~ ^(none|retry) ]]; then
            VERSION_NUM=$(node -p "require('./package.json').version")
            TAG_NAME="v$VERSION_NUM"
            echo "Retrying current version $VERSION_NUM ($TAG_NAME)..."
            
            # Force-point the tag to the current HEAD commit being released
            git tag -fa "$TAG_NAME" -m "chore(release): release $TAG_NAME [skip ci]"
            git push origin "$TAG_NAME" --force
          else
            echo "Incrementing version ($BUMP_TYPE)..."
            TAG_NAME=$(npm version $BUMP_TYPE -m "chore(release): bump version to %s [skip ci]")
            VERSION_NUM="${TAG_NAME#v}"
            echo "Successfully bumped version to $VERSION_NUM ($TAG_NAME)"
            git push origin HEAD:${{ github.ref_name }} --follow-tags
          fi

          echo "new_version=$VERSION_NUM" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag_name }}
          name: Obsidian Code ${{ steps.bump.outputs.tag_name }}
          body: |
            ## Obsidian Code ${{ steps.bump.outputs.tag_name }}
            
            Automated multi-platform desktop release for Windows and macOS.
            
            ### Package Artifacts:
            - **Windows**: `Obsidian.Code-Setup-*.exe` (NSIS Setup Wizard)
            - **macOS**: `Obsidian.Code-*-arm64.dmg` (Apple Silicon) & `Obsidian.Code-*-x64.dmg` (Intel)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-desktop:
    name: Build (${{ matrix.os_name }})
    needs: bump-version
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_name: Windows
            build_script: desktop:build:win
          - os: macos-latest
            os_name: macOS
            build_script: desktop:build:mac

    steps:
      - name: Checkout repository at version tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Desktop Application
        run: npm run ${{ matrix.build_script }}
        env:
          ELECTRON: 'true'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets['VITE_CLERK_PUBLISHABLE_KEY'] || 'pk_test_dG9nZXRoZXItaGVuLTg4MTAuY2xlcmsuYWNjb3VudHMuZGV2JA' }}
          VITE_API_URL: ${{ secrets['VITE_API_URL'] || '' }}
          VITE_WS_URL: ${{ secrets['VITE_WS_URL'] || '' }}

      - name: Upload Binaries to GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.bump-version.outputs.tag_name }}
        run: |
          shopt -s nullglob
          # Explicitly upload only clean distribution binaries and auto-updater channel manifests
          # Specifically excludes builder-debug.yml and temporary build artifacts
          FILES=(dist/desktop/*.exe dist/desktop/*.dmg dist/desktop/latest*.yml)
          if [ ${#FILES[@]} -gt 0 ]; then
            echo "Uploading ${#FILES[@]} clean production assets to release $TAG_NAME (with --clobber)..."
            gh release upload "$TAG_NAME" "${FILES[@]}" --clobber
          else
            echo "No matching production binary files found to upload."
          fi
