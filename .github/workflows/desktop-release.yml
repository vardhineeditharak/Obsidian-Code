name: Build Desktop (Windows & macOS)

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version increment level'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  bump-version:
    name: Auto-Increment Version & Tag
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      tag_name: ${{ steps.bump.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Increment Version
        id: bump
        run: |
          BUMP_TYPE="${{ github.event.inputs.bump_type || 'patch' }}"
          echo "Incrementing version ($BUMP_TYPE)..."
          TAG_NAME=$(npm version $BUMP_TYPE -m "chore(release): bump version to %s [skip ci]")
          VERSION_NUM="${TAG_NAME#v}"
          echo "new_version=$VERSION_NUM" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Successfully bumped version to $VERSION_NUM ($TAG_NAME)"

      - name: Push Version Commit & Tag
        run: |
          git push origin HEAD:${{ github.ref_name }} --follow-tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag_name }}
          name: Obsidian Code ${{ steps.bump.outputs.tag_name }}
          body: |
            ## Obsidian Code ${{ steps.bump.outputs.tag_name }}
            
            Automated multi-platform desktop release for Windows and macOS.
            
            ### Package Artifacts:
            - **Windows**: NSIS Setup Installer (`.exe`) & Standalone Portable (`.exe`)
            - **macOS**: Apple Silicon (`arm64`) & Intel (`x64`) Disk Images (`.dmg`) & Archives (`.zip`)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-desktop:
    name: Build (${{ matrix.os_name }})
    needs: bump-version
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_name: Windows
            build_script: desktop:build:win
            artifact_name: obsidian-code-windows
          - os: macos-latest
            os_name: macOS
            build_script: desktop:build:mac
            artifact_name: obsidian-code-macos

    steps:
      - name: Checkout repository at new version tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Desktop Application
        run: npm run ${{ matrix.build_script }}
        env:
          ELECTRON: 'true'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY || 'pk_test_dG9nZXRoZXItaGVuLTg4MTAuY2xlcmsuYWNjb3VudHMuZGV2JA' }}
          VITE_API_URL: ${{ secrets.VITE_API_URL || '' }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL || '' }}

      - name: Upload Artifacts to Action Run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-${{ needs.bump-version.outputs.new_version }}
          path: |
            dist/desktop/*.exe
            dist/desktop/*.dmg
            dist/desktop/*.zip
            dist/desktop/*.blockmap
          retention-days: 14

      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bump-version.outputs.tag_name }}
          files: |
            dist/desktop/*.exe
            dist/desktop/*.dmg
            dist/desktop/*.zip
            dist/desktop/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
