<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Obsidian Code — Real-Time Collaborative Code Editor</title>

      content="Obsidian Code is a high-performance, real-time collaborative workspace for code with local-first editing, CRDT synchronization, and VS Code ergonomics."
